<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-hidden="true">
  <title>Las tres bolsas de nuam</title>
  <!--
    Placeholder de producción (D8, PLAN-REDISENO.md). Ver la nota de
    paleta completa y la excepción a la regla dura 1 de CLAUDE.md en
    p14-renta-variable.svg, mismo criterio en los cinco SVG de esta
    capa. nuam orange 500 FF4201, nuam grey 0 FFFFFF, nuam grey 50
    FAFAFA, nuam grey 200 E6E6E6, nuam grey 600 535353, nuam grey 950
    0B0B0B.

    Sin banderas de país a propósito: CLAUDE.md deja fuera de alcance
    cualquier selector o variación de contenido por país (el argumento
    tri-país vive en el glosario e infografía estática aparte) — esto es
    contenido neutro sobre las tres bolsas, no un selector.
  -->
  <rect width="1600" height="900" fill="#FFFFFF"/>

  <g font-family="Arial, Helvetica, sans-serif">
    <!-- Ícono compartido de fila: se repite dentro de cada tarjeta -->
    <!-- Tarjeta Colombia -->
    <g transform="translate(60 60)">
      <rect width="460" height="780" rx="20" fill="#FAFAFA" stroke="#E6E6E6" stroke-width="3"/>
      <rect width="460" height="110" rx="20" fill="#0B0B0B"/>
      <rect y="70" width="460" height="40" fill="#0B0B0B"/>
      <text x="230" y="68" text-anchor="middle" font-size="36" font-weight="700" fill="#FFFFFF">Colombia</text>

      <g transform="translate(40 160)">
        <circle cx="30" cy="30" r="30" fill="#FF4201"/>
        <rect x="16" y="24" width="28" height="18" fill="none" stroke="#FFFFFF" stroke-width="4"/>
        <line x1="16" y1="24" x2="30" y2="14" stroke="#FFFFFF" stroke-width="4"/>
        <line x1="44" y1="24" x2="30" y2="14" stroke="#FFFFFF" stroke-width="4"/>
        <text x="80" y="24" font-size="22" fill="#727272">Bolsa</text>
        <text x="80" y="54" font-size="27" font-weight="700" fill="#0B0B0B">Bolsa de Valores</text>
        <text x="80" y="84" font-size="27" font-weight="700" fill="#0B0B0B">de Colombia</text>
      </g>

      <g transform="translate(40 300)">
        <circle cx="30" cy="30" r="30" fill="#FF4201"/>
        <path d="M 30 12 L 46 20 L 46 34 C 46 44 39 51 30 54 C 21 51 14 44 14 34 L 14 20 Z" fill="none" stroke="#FFFFFF" stroke-width="4" stroke-linejoin="round"/>
        <text x="80" y="24" font-size="22" fill="#727272">Supervisor</text>
        <text x="80" y="54" font-size="27" font-weight="700" fill="#0B0B0B">SFC</text>
      </g>

      <g transform="translate(40 420)">
        <circle cx="30" cy="30" r="30" fill="#FF4201"/>
        <rect x="14" y="20" width="32" height="24" rx="3" fill="none" stroke="#FFFFFF" stroke-width="4"/>
        <circle cx="30" cy="32" r="4" fill="#FFFFFF"/>
        <text x="80" y="24" font-size="22" fill="#727272">Depósito</text>
        <text x="80" y="54" font-size="27" font-weight="700" fill="#0B0B0B">Deceval</text>
      </g>
    </g>

    <!-- Tarjeta Perú -->
    <g transform="translate(570 60)">
      <rect width="460" height="780" rx="20" fill="#FAFAFA" stroke="#E6E6E6" stroke-width="3"/>
      <rect width="460" height="110" rx="20" fill="#0B0B0B"/>
      <rect y="70" width="460" height="40" fill="#0B0B0B"/>
      <text x="230" y="68" text-anchor="middle" font-size="36" font-weight="700" fill="#FFFFFF">Perú</text>

      <g transform="translate(40 160)">
        <circle cx="30" cy="30" r="30" fill="#FF4201"/>
        <rect x="16" y="24" width="28" height="18" fill="none" stroke="#FFFFFF" stroke-width="4"/>
        <line x1="16" y1="24" x2="30" y2="14" stroke="#FFFFFF" stroke-width="4"/>
        <line x1="44" y1="24" x2="30" y2="14" stroke="#FFFFFF" stroke-width="4"/>
        <text x="80" y="24" font-size="22" fill="#727272">Bolsa</text>
        <text x="80" y="54" font-size="27" font-weight="700" fill="#0B0B0B">Bolsa de Valores</text>
        <text x="80" y="84" font-size="27" font-weight="700" fill="#0B0B0B">de Lima</text>
      </g>

      <g transform="translate(40 300)">
        <circle cx="30" cy="30" r="30" fill="#FF4201"/>
        <path d="M 30 12 L 46 20 L 46 34 C 46 44 39 51 30 54 C 21 51 14 44 14 34 L 14 20 Z" fill="none" stroke="#FFFFFF" stroke-width="4" stroke-linejoin="round"/>
        <text x="80" y="24" font-size="22" fill="#727272">Supervisor</text>
        <text x="80" y="54" font-size="27" font-weight="700" fill="#0B0B0B">SMV</text>
      </g>

      <g transform="translate(40 420)">
        <circle cx="30" cy="30" r="30" fill="#FF4201"/>
        <rect x="14" y="20" width="32" height="24" rx="3" fill="none" stroke="#FFFFFF" stroke-width="4"/>
        <circle cx="30" cy="32" r="4" fill="#FFFFFF"/>
        <text x="80" y="24" font-size="22" fill="#727272">Depósito</text>
        <text x="80" y="54" font-size="27" font-weight="700" fill="#0B0B0B">CAVALI</text>
      </g>
    </g>

    <!-- Tarjeta Chile -->
    <g transform="translate(1080 60)">
      <rect width="460" height="780" rx="20" fill="#FAFAFA" stroke="#E6E6E6" stroke-width="3"/>
      <rect width="460" height="110" rx="20" fill="#0B0B0B"/>
      <rect y="70" width="460" height="40" fill="#0B0B0B"/>
      <text x="230" y="68" text-anchor="middle" font-size="36" font-weight="700" fill="#FFFFFF">Chile</text>

      <g transform="translate(40 160)">
        <circle cx="30" cy="30" r="30" fill="#FF4201"/>
        <rect x="16" y="24" width="28" height="18" fill="none" stroke="#FFFFFF" stroke-width="4"/>
        <line x1="16" y1="24" x2="30" y2="14" stroke="#FFFFFF" stroke-width="4"/>
        <line x1="44" y1="24" x2="30" y2="14" stroke="#FFFFFF" stroke-width="4"/>
        <text x="80" y="24" font-size="22" fill="#727272">Bolsa</text>
        <text x="80" y="54" font-size="27" font-weight="700" fill="#0B0B0B">Bolsa de</text>
        <text x="80" y="84" font-size="27" font-weight="700" fill="#0B0B0B">Santiago</text>
      </g>

      <g transform="translate(40 300)">
        <circle cx="30" cy="30" r="30" fill="#FF4201"/>
        <path d="M 30 12 L 46 20 L 46 34 C 46 44 39 51 30 54 C 21 51 14 44 14 34 L 14 20 Z" fill="none" stroke="#FFFFFF" stroke-width="4" stroke-linejoin="round"/>
        <text x="80" y="24" font-size="22" fill="#727272">Supervisor</text>
        <text x="80" y="54" font-size="27" font-weight="700" fill="#0B0B0B">CMF</text>
      </g>

      <g transform="translate(40 420)">
        <circle cx="30" cy="30" r="30" fill="#FF4201"/>
        <rect x="14" y="20" width="32" height="24" rx="3" fill="none" stroke="#FFFFFF" stroke-width="4"/>
        <circle cx="30" cy="32" r="4" fill="#FFFFFF"/>
        <text x="80" y="24" font-size="22" fill="#727272">Depósito</text>
        <text x="80" y="54" font-size="27" font-weight="700" fill="#0B0B0B">DCV</text>
      </g>
    </g>
  </g>
</svg>
