<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-hidden="true">
  <title>Tres emisores ficticios y su nivel de riesgo</title>
  <!--
    Placeholder de producción (D8, PLAN-REDISENO.md). Ver la nota de
    paleta completa y la excepción a la regla dura 1 de CLAUDE.md en
    p14-renta-variable.svg, mismo criterio en los cinco SVG de esta
    capa. nuam orange 500 FF4201, nuam grey 0 FFFFFF, nuam grey 50
    FAFAFA, nuam grey 200 E6E6E6, nuam grey 300 D3D3D3, nuam grey 600
    535353, nuam grey 950 0B0B0B.

    El nivel de riesgo nunca se distingue solo por el número de barras
    llenas (regla dura 3 de CLAUDE.md): cada tarjeta repite el nivel
    como texto explícito debajo del medidor.
  -->
  <rect width="1600" height="900" fill="#FFFFFF"/>

  <g font-family="Arial, Helvetica, sans-serif">
    <!-- Petrocaribe — alto riesgo -->
    <g transform="translate(60 60)">
      <rect width="460" height="780" rx="20" fill="#FAFAFA" stroke="#E6E6E6" stroke-width="3"/>
      <circle cx="230" cy="110" r="50" fill="#FF4201"/>
      <path d="M 230 76 C 214 100 206 114 214 130 C 206 128 200 118 202 106 C 190 122 192 146 210 156 C 228 166 250 156 254 138 C 258 148 256 158 248 166 C 264 156 270 132 254 112 C 250 122 244 126 238 122 C 246 108 240 90 230 76 Z" fill="#FFFFFF"/>
      <text x="230" y="210" text-anchor="middle" font-size="34" font-weight="700" fill="#0B0B0B">Petrocaribe</text>
      <text x="230" y="250" text-anchor="middle" font-size="24" fill="#535353">Sensible a precios</text>
      <text x="230" y="280" text-anchor="middle" font-size="24" fill="#535353">de energía</text>

      <g transform="translate(165 340)">
        <rect x="0" y="60" width="30" height="30" fill="#0B0B0B"/>
        <rect x="45" y="30" width="30" height="60" fill="#0B0B0B"/>
        <rect x="90" y="0" width="30" height="90" fill="#0B0B0B"/>
      </g>
      <text x="230" y="470" text-anchor="middle" font-size="30" font-weight="700" fill="#0B0B0B">Alto riesgo</text>
    </g>

    <!-- Andina Cementos — riesgo medio -->
    <g transform="translate(570 60)">
      <rect width="460" height="780" rx="20" fill="#FAFAFA" stroke="#E6E6E6" stroke-width="3"/>
      <circle cx="230" cy="110" r="50" fill="#FF4201"/>
      <g transform="translate(202 82)">
        <rect x="0" y="14" width="56" height="42" fill="none" stroke="#FFFFFF" stroke-width="5"/>
        <line x1="0" y1="28" x2="56" y2="28" stroke="#FFFFFF" stroke-width="4"/>
        <line x1="14" y1="14" x2="14" y2="56" stroke="#FFFFFF" stroke-width="4"/>
        <line x1="28" y1="14" x2="28" y2="56" stroke="#FFFFFF" stroke-width="4"/>
        <line x1="42" y1="14" x2="42" y2="56" stroke="#FFFFFF" stroke-width="4"/>
        <path d="M -4 14 L 28 -6 L 60 14" fill="none" stroke="#FFFFFF" stroke-width="5" stroke-linejoin="round"/>
      </g>
      <text x="230" y="210" text-anchor="middle" font-size="34" font-weight="700" fill="#0B0B0B">Andina Cementos</text>
      <text x="230" y="250" text-anchor="middle" font-size="24" fill="#535353">Infraestructura y</text>
      <text x="230" y="280" text-anchor="middle" font-size="24" fill="#535353">construcción</text>

      <g transform="translate(165 340)">
        <rect x="0" y="60" width="30" height="30" fill="#0B0B0B"/>
        <rect x="45" y="30" width="30" height="60" fill="#0B0B0B"/>
        <rect x="90" y="0" width="30" height="90" fill="#D3D3D3"/>
      </g>
      <text x="230" y="470" text-anchor="middle" font-size="30" font-weight="700" fill="#0B0B0B">Riesgo medio</text>
    </g>

    <!-- Banco del Sur — riesgo medio-bajo -->
    <g transform="translate(1080 60)">
      <rect width="460" height="780" rx="20" fill="#FAFAFA" stroke="#E6E6E6" stroke-width="3"/>
      <circle cx="230" cy="110" r="50" fill="#FF4201"/>
      <g transform="translate(196 82)">
        <path d="M 0 16 L 34 -8 L 68 16 Z" fill="none" stroke="#FFFFFF" stroke-width="5" stroke-linejoin="round"/>
        <line x1="0" y1="16" x2="68" y2="16" stroke="#FFFFFF" stroke-width="5"/>
        <line x1="8" y1="24" x2="8" y2="52" stroke="#FFFFFF" stroke-width="5"/>
        <line x1="26" y1="24" x2="26" y2="52" stroke="#FFFFFF" stroke-width="5"/>
        <line x1="42" y1="24" x2="42" y2="52" stroke="#FFFFFF" stroke-width="5"/>
        <line x1="60" y1="24" x2="60" y2="52" stroke="#FFFFFF" stroke-width="5"/>
        <line x1="-4" y1="58" x2="72" y2="58" stroke="#FFFFFF" stroke-width="5"/>
      </g>
      <text x="230" y="210" text-anchor="middle" font-size="34" font-weight="700" fill="#0B0B0B">Banco del Sur</text>
      <text x="230" y="250" text-anchor="middle" font-size="24" fill="#535353">Negocio financiero</text>
      <text x="230" y="280" text-anchor="middle" font-size="24" fill="#535353">diversificado</text>

      <g transform="translate(165 340)">
        <rect x="0" y="60" width="30" height="30" fill="#0B0B0B"/>
        <rect x="45" y="30" width="30" height="60" fill="#D3D3D3"/>
        <rect x="90" y="0" width="30" height="90" fill="#D3D3D3"/>
      </g>
      <text x="230" y="470" text-anchor="middle" font-size="28" font-weight="700" fill="#0B0B0B">Riesgo medio-bajo</text>
    </g>
  </g>
</svg>
