<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-hidden="true">
  <title>Orden a mercado frente a orden límite</title>
  <!--
    Placeholder de producción (D8, PLAN-REDISENO.md). Ver la nota de
    paleta completa y la excepción a la regla dura 1 de CLAUDE.md en
    p14-renta-variable.svg, mismo criterio en los cinco SVG de esta
    capa. nuam orange 500 FF4201, nuam grey 0 FFFFFF, nuam grey 50
    FAFAFA, nuam grey 100 F5F5F5, nuam grey 200 E6E6E6, nuam grey 600
    535353, nuam grey 950 0B0B0B.

    El estado de ejecución no se distingue solo por color (regla dura 3
    de CLAUDE.md): cada resultado lleva su propio ícono más el texto.
  -->
  <rect width="1600" height="900" fill="#FFFFFF"/>

  <g font-family="Arial, Helvetica, sans-serif">
    <!-- Orden a mercado -->
    <g transform="translate(120 100)">
      <rect width="620" height="680" rx="20" fill="#FAFAFA" stroke="#E6E6E6" stroke-width="3"/>
      <circle cx="90" cy="90" r="46" fill="#FF4201"/>
      <path d="M 96 56 L 70 96 L 88 96 L 82 126 L 112 84 L 92 84 Z" fill="#FFFFFF"/>
      <text x="160" y="102" font-size="36" font-weight="700" fill="#0B0B0B">Orden a mercado</text>

      <text x="50" y="200" font-size="27" fill="#3D3D3D">Busca ejecución rápida</text>
      <text x="50" y="240" font-size="27" fill="#3D3D3D">al mejor precio</text>
      <text x="50" y="280" font-size="27" fill="#3D3D3D">disponible en el momento.</text>

      <rect x="50" y="340" width="520" height="90" rx="45" fill="#F5F5F5"/>
      <circle cx="105" cy="385" r="26" fill="#0B0B0B"/>
      <path d="M 93 385 L 101 393 L 118 373" fill="none" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="150" y="394" font-size="26" font-weight="700" fill="#0B0B0B">Ejecución inmediata</text>
    </g>

    <!-- Orden límite -->
    <g transform="translate(860 100)">
      <rect width="620" height="680" rx="20" fill="#FAFAFA" stroke="#E6E6E6" stroke-width="3"/>
      <circle cx="90" cy="90" r="46" fill="#FF4201"/>
      <circle cx="90" cy="90" r="26" fill="none" stroke="#FFFFFF" stroke-width="5"/>
      <circle cx="90" cy="90" r="6" fill="#FFFFFF"/>
      <text x="160" y="102" font-size="36" font-weight="700" fill="#0B0B0B">Orden límite</text>

      <text x="50" y="200" font-size="27" fill="#3D3D3D">Fija el precio máximo de</text>
      <text x="50" y="240" font-size="27" fill="#3D3D3D">compra o mínimo de venta</text>
      <text x="50" y="280" font-size="27" fill="#3D3D3D">que estás dispuesto a aceptar.</text>

      <rect x="50" y="340" width="520" height="90" rx="45" fill="#F5F5F5"/>
      <circle cx="105" cy="385" r="26" fill="#0B0B0B"/>
      <circle cx="105" cy="385" r="16" fill="none" stroke="#FFFFFF" stroke-width="4"/>
      <line x1="105" y1="385" x2="105" y2="374" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round"/>
      <line x1="105" y1="385" x2="113" y2="389" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round"/>
      <text x="150" y="394" font-size="26" font-weight="700" fill="#0B0B0B">Puede no ejecutarse</text>
    </g>
  </g>
</svg>
