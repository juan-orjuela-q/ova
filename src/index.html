<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Academia Virtual nuam</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=PT+Serif:wght@400;700&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=swap"
    rel="stylesheet"
  />

  <link rel="stylesheet" href="styles/tokens.css" />
  <link rel="stylesheet" href="styles/base.css" />
  <link rel="stylesheet" href="styles/layouts.css" />
  <link rel="stylesheet" href="styles/components.css" />
</head>
<body class="ova-marco">
  <!-- Skip link (T3): primer elemento tabulable de la página. Salta a
       #app, que tiene tabindex="-1" más abajo para poder recibir foco
       aunque no sea nativamente focalizable. Apunta a "#app" y no al
       id de una pantalla porque el router es quien decide cuál
       pantalla está activa; alCambiarHash() en router.js ignora este
       hash a propósito (no es id de ninguna pantalla) en vez de
       tratarlo como una ruta inválida. -->
  <a href="#app" class="u-skip-link">Saltar al contenido</a>

  <!-- Región de anuncios de a11y.js. Vacía en reposo; router.js la
       llena en cada cambio de pantalla (nunca en la carga inicial). -->
  <div id="anuncios" class="u-oculto-visualmente" aria-live="polite" aria-atomic="true"></div>

  <!-- Barra superior (T3, landmark banner): título de la pantalla
       activa, botón del drawer, progreso, reanudar y guardado. Todo
       el contenido de texto lo llena router.js en cada navegación. -->
  <header class="nav-barra">
    <button
      id="drawer-abrir"
      class="boton-icono"
      type="button"
      aria-expanded="false"
      aria-controls="drawer"
    >
      <span class="icono" aria-hidden="true">menu</span>
      <span class="u-oculto-visualmente">Abrir índice de la unidad</span>
    </button>

    <!-- Migas de pan / jerarquía (D1): Unidad › Cápsula › Tema. Sin
         <a>: ningún nivel tiene pantalla de destino propia dentro de
         la OVA, ese índice navegable es el drawer. router.js
         (actualizarMigas) llena texto y alterna hidden/aria-current
         en cada navegación — ver la nota completa ahí. -->
    <nav id="nav-migas" class="nav-migas" aria-label="Ubicación">
      <ol>
        <li id="nav-migas-unidad" class="nav-migas__unidad eyebrow eyebrow--subtle"></li>
        <li id="nav-migas-capsula" class="nav-migas__capsula" hidden>
          <span class="nav-migas__separador" aria-hidden="true">›</span>
          <span id="nav-migas-capsula-texto" class="nav-migas__texto"></span>
        </li>
        <li id="nav-migas-tema" class="nav-migas__tema" aria-current="page">
          <span id="nav-migas-tema-separador" class="nav-migas__separador" aria-hidden="true" hidden>›</span>
          <span id="nav-migas-tema-texto"></span>
        </li>
      </ol>
    </nav>

    <div class="nav-barra__progreso">
      <span id="nav-progreso-texto"></span>
      <div
        id="nav-progreso"
        class="barra-progreso"
        role="progressbar"
        aria-valuemin="0"
        aria-valuemax="100"
        aria-valuenow="0"
        aria-labelledby="nav-progreso-etiqueta"
      >
        <span id="nav-progreso-etiqueta" class="u-oculto-visualmente">Progreso del curso</span>
        <span id="nav-progreso-relleno" class="barra-progreso__relleno"></span>
      </div>
    </div>

    <button id="nav-reanudar" class="boton boton--outline boton--inverse" type="button" hidden>
      <span class="boton__icono" aria-hidden="true">play_circle</span> Reanudar
    </button>

    <p id="nav-guardado" class="nav-barra__guardado">
      <span id="nav-guardado-icono" class="icono" aria-hidden="true">cloud_done</span>
      <span id="nav-guardado-texto">Guardado</span>
    </p>

    <!-- Pantalla completa (C2), disponible en todo el recorrido salvo
         L01 (la portada esconde esta barra entera — regla dura 9 de
         CLAUDE.md, tiene su propio botón más abajo). Arranca `hidden`:
         router.js solo lo revela si document.fullscreenEnabled es
         true, nunca deja un botón que no hace nada (misma trampa 2 de
         PLAN-CONTENIDO.md §4.3 que ya resolvió media.js en T4). -->
    <button id="nav-pantalla-completa" class="boton-icono" type="button" hidden>
      <span class="icono" aria-hidden="true">fullscreen</span>
      <span class="u-oculto-visualmente">Pantalla completa</span>
    </button>
  </header>

  <!-- El router (T2) monta aquí la pantalla activa. tabindex="0" (C2,
       antes "-1"): sigue siendo el destino del skip link, pero además
       #app tiene su propio scroll desde C2 (el marco fijo de
       base.css/layouts.css) y una región con scroll necesita ser
       alcanzable por teclado de verdad, no solo con rueda o dedo —
       trampa 1 de PLAN-CONTENIDO.md §4.3. aria-label le da nombre
       accesible a esa nueva parada de Tab. -->
  <main id="app" tabindex="0" aria-label="Contenido de la pantalla"></main>

  <!-- Segunda aparición del botón de pantalla completa (C2, sección 4.2
       de PLAN-CONTENIDO.md): vive fuera de #app y de .layout--l01 a
       propósito. .layout--l01 tiene overflow:hidden (recorta los SVG de
       unión) y un position:fixed anidado ahí puede quedar clipeado
       según el navegador; como hijo directo de <body> no depende de
       eso. Arranca `hidden` (nunca un botón que no hace nada, mismo
       criterio que el de arriba) y además oculto por opacidad: solo se
       revela cuando la pantalla activa es L01, y ahí router.js espera
       unos segundos antes de mostrarlo — nunca roba el foco porque
       nunca llama a .focus(), solo quita `hidden` y agrega una clase
       (trampa 3 de PLAN-CONTENIDO.md §4.3). -->
  <button id="nav-portada-completa" class="boton-icono boton-icono--portada" type="button" hidden>
    <span class="icono" aria-hidden="true">fullscreen</span>
    <span class="u-oculto-visualmente">Pantalla completa</span>
  </button>

  <!-- Barra inferior (T2, cableada; T3 no la toca). -->
  <footer class="nav-inferior">
    <button id="nav-anterior" class="boton boton--outline" type="button">
      <span class="boton__icono" aria-hidden="true">arrow_back</span> Anterior
    </button>
    <span id="nav-paso" class="nav-inferior__paso"></span>
    <button id="nav-siguiente" class="boton" type="button">
      Siguiente <span class="boton__icono" aria-hidden="true">arrow_forward</span>
    </button>
  </footer>

  <!-- Drawer de índice (T3). Oculto por defecto con `hidden` —fuera
       del orden de tabulación y del árbol de accesibilidad mientras
       está cerrado, no solo invisible—. role="dialog" + aria-modal
       porque mientras está abierto es una trampa de foco intencional
       (router.js la cicla con OVA.a11y.ciclarFocoEn); Escape, el
       backdrop y el botón "Cerrar" son las tres salidas, para que esa
       trampa nunca sea una trampa de verdad. -->
  <div id="drawer-backdrop" class="backdrop" hidden></div>
  <div
    id="drawer"
    class="nav-drawer nav-drawer--flotante"
    role="dialog"
    aria-modal="true"
    aria-labelledby="drawer-titulo"
    hidden
  >
    <div class="nav-drawer__cabecera">
      <p id="drawer-titulo" class="nav-drawer__titulo"></p>
      <button id="drawer-cerrar" class="boton-icono" type="button">
        <span class="icono" aria-hidden="true">close</span>
        <span class="u-oculto-visualmente">Cerrar índice</span>
      </button>
    </div>
    <nav id="drawer-lista" aria-label="Pantallas de la unidad"></nav>
  </div>

  <!-- Scripts clásicos, no type="module": Chromium bloquea por CORS
       la carga de módulos ES (y fetch/XHR) bajo file://, verificado
       con Playwright en T2 — ver la nota de convenciones en
       CLAUDE.md. Cada archivo cuelga su export de window.OVA; el
       orden importa porque no hay import/export real. -->
  <script src="content/ova-u1.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/scorm.js"></script>
  <script src="js/state.js"></script>
  <script src="js/a11y.js"></script>
  <script src="js/media.js"></script>
  <script src="js/quiz.js"></script>
  <script src="js/charts.js"></script>
  <script src="js/router.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
